[package]
name = "poweredge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "RGB2link PowerEdge: typed AI intents, pinned templates, deterministic n2link flow compiler and fail-closed validator."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true

[[bin]]
name = "poweredge-template"
path = "src/bin/poweredge-template.rs"
